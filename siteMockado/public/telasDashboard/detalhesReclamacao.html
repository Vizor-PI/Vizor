<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhe Reclamação</title>
    <link rel="icon" href="../assets/imgs/logosDash/home.png" type="image/x-icon" />
    <link rel="stylesheet" href="../assets/css/css-dashboard/detalhesReclamacao.css">
</head>

<body>

    <header class="header-voltar">
        <a href="reclamacaoLote.html" class="voltar-btn">← Voltar ao Dashboard</a>
    </header>

    <section class="titulo-area">
        <div class="icon-box">💬</div>
        <h1 id="titulo-reclamacao">Detalhes da Reclamação</h1>
    </section>

    <section class="card card-reclamacao">

        <div class="linha">
            <div class="campo">
                <span>👤 Player ID</span>
                <strong id="rec-player"></strong>
            </div>

            <div class="campo">
                <span>📦 Lote</span>
                <strong id="rec-lote"></strong>
            </div>

            <div class="campo">
                <span>📅 Data</span>
                <strong id="rec-data"></strong>
            </div>

            <div class="campo">
                <span>⚠ Gravidade</span>
                <span class="gravidade-badge" id="rec-gravidade"></span>
            </div>
        </div>

        <hr>

        <div class="descricao-bloco">
            <span>Descrição</span>
            <p id="rec-descricao"></p>
        </div>

    </section>

    <section class="card card-reclamacoes-lote">
        <header class="reclam-lote-header">
            <h2 class="card-title">📂 Reclamações no lote <span id="nome-lote-titulo"></span></h2>
            <span class="badge badge-total" id="recl-lote-total">0</span>
        </header>
        <div id="reclamacoes-lote-lista" class="reclam-lista">
        </div>
    </section>

    <script src="../js/detalhesReclamacao.js"></script>

    <script>
        const mockReclamacoes = {
            reclamacoes: [
                { id: 3321, lote: "1008234", player_id: "P-7781", data: "03/12/2024", descricao: "Falha no boot", gravidade: "Crítica" },
                { id: 3322, lote: "1008234", player_id: "P-5512", data: "02/12/2024", descricao: "Superaquecimento", gravidade: "Média" },
                { id: 3324, lote: "1008234", player_id: "P-2211", data: "01/12/2024", descricao: "BIOS travando", gravidade: "Baixa" },
                { id: 3323, lote: "2204102", player_id: "P-9802", data: "01/12/2024", descricao: "RAM não reconhece", gravidade: "Crítica" },
                { id: 3325, lote: "3001111", player_id: "P-1118", data: "30/11/2024", descricao: "Ruído no disco", gravidade: "Média" }
            ]
        };

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const idRec = params.get("reclamacao");

            const rec = mockReclamacoes.reclamacoes.find(r => r.id == idRec);
            if (!rec) return;

            document.getElementById("titulo-reclamacao").innerText =
                `Detalhes da Reclamação #${idRec}`;

            preencherInfo(rec);
            
            const reclamacoesMesmoLote = mockReclamacoes.reclamacoes.filter(r => r.lote == rec.lote && r.id != rec.id);

            document.getElementById("nome-lote-titulo").innerText = rec.lote;
            document.getElementById("recl-lote-total").innerText = reclamacoesMesmoLote.length;

            montarListaLote(reclamacoesMesmoLote);
        });

        function preencherInfo(rec) {
            document.getElementById("rec-player").innerText = rec.player_id;
            document.getElementById("rec-lote").innerText = rec.lote;
            document.getElementById("rec-data").innerText = rec.data;
            document.getElementById("rec-descricao").innerText = rec.descricao;

            const badge = document.getElementById("rec-gravidade");
            badge.innerText = rec.gravidade;

            badge.className = "gravidade-badge " + (
                rec.gravidade === "Crítica" ? "gravidade-alta" :
                    rec.gravidade === "Média" ? "gravidade-media" :
                        "gravidade-baixa"
            );
        }

        function montarListaLote(lista) {
            const div = document.getElementById("reclamacoes-lote-lista");

            const peso = { "Crítica": 3, "Média": 2, "Baixa": 1 };
            lista.sort((a, b) => peso[b.gravidade] - peso[a.gravidade]);

            div.innerHTML = "";

            lista.forEach(r => {
                let classe =
                    r.gravidade === "Crítica" ? "gravidade-alta" :
                        r.gravidade === "Média" ? "gravidade-media" :
                            "gravidade-baixa";

                div.innerHTML += `
            <div class="reclam-item" onclick="window.location='detalhesReclamacao.html?reclamacao=${r.id}'">
                <span class="badge gravidade-badge badge-na-lista ${classe}">${r.gravidade}</span>
                <strong>#${r.id} — ${r.player_id}</strong>
                <p class="desc">${r.descricao}</p>
                <p class="data">📅 ${r.data}</p>
            </div>
        `;
            });
        }

        const params = new URLSearchParams(window.location.search);
        const reclamacao = params.get("reclamacao");

        document.getElementById("titulo-lote").innerText = `Reclamacao ${reclamacao}`;
    </script>

</body>

</html>
